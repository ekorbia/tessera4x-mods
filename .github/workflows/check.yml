name: Check mods

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every mod passes the game's schema and the house rules
        run: npm run check
      - name: The generated parts of the READMEs are up to date
        run: npm run catalogue -- --check
